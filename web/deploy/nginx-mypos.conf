# Nginx site for mypos.cloudpharma.site → Next.js (pm2) on 127.0.0.1:3010
server {
    listen 80;
    listen [::]:80;
    server_name mypos.cloudpharma.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mypos.cloudpharma.site;

    # Certbot will replace these paths when SSL is issued
    ssl_certificate     /etc/letsencrypt/live/mypos.cloudpharma.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypos.cloudpharma.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
